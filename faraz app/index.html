<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faraz Chat - Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: Arial; 
    background: #1a1a2e; 
    color: #fff; 
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #16213e;
    padding: 15px;
    text-align: center;
    border-bottom: 2px solid #0f3460;
  }
  .header h1 { font-size: 20px; color: #00ff88; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .message {
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 80%;
    word-wrap: break-word;
  }
  .message.own {
    background: #00ff88;
    color: #000;
    align-self: flex-end;
  }
  .message.other {
    background: #0f3460;
    color: #fff;
    align-self: flex-start;
  }
  .message .user {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
    opacity: 0.8;
  }
  .input-area {
    display: flex;
    padding: 15px;
    background: #16213e;
    gap: 10px;
  }
  .input-area input {
    flex: 1;
    padding: 12px;
    border-radius: 25px;
    border: none;
    outline: none;
    font-size: 16px;
  }
  .input-area button {
    padding: 12px 25px;
    background: #00ff88;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="header">
  <h1>💬 Faraz Chat</h1>
</div>
<div class="messages">
  <div class="message other">
    <div class="user">Dost</div>
    Salam bhai! Kaisa hai?
  </div>
  <div class="message own">
    <div class="user">Faraz</div>
    Walaikum Salam! Main theek hoon 😎
  </div>
  <div class="message other">
    <div class="user">Dost</div>
    Yeh tera app hai? Kamaal hai!
  </div>
  <div class="message own">
    <div class="user">Faraz</div>
    Haan bhai! Apna server, apna app 🚀
  </div>
</div>
<div class="input-area">
  <input type="text" placeholder="Message likho...">
  <button>Send</button>
</div>
</body>
</html>
